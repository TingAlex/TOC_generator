[project]
name = "pdf-toc"
version = "1.4.2"
description = "PDF 目录识别 + 书签 + 按章节拆分 + OneNote 打印导入、整理与线性同步"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "pymupdf>=1.27.2.3",
    # Pipeline 2.5/3/4/5：OneNote 本地 COM 自动化（仅 Windows + OneNote 桌面版）
    "comtypes>=1.4.16; sys_platform == 'win32'",
    # Pipeline 5：驱动 OneNote 自身的“移动或复制页”对话框，完整保留 XPS 打印源
    "pywinauto>=0.6.9; sys_platform == 'win32'",
]

# console_scripts 入口：库代码在 src/tocgen/，命令统一 toc-* 前缀。
# 所有命令都应在项目根目录下运行（数据目录 books-todo/done/work 相对 CWD 解析）。
[project.scripts]
toc-claude            = "tocgen.cli.claude_toc:main"       # Pipeline 1：渲染目录页 / 写书签（Claude 看图，无 API）
toc-init              = "tocgen.cli.init:main"             # 初始化 Excel 配置
toc-split             = "tocgen.cli.split:main"            # Pipeline 2 单本
toc-split-all         = "tocgen.cli.split_all:main"        # Pipeline 2 批量
toc-boundaries        = "tocgen.cli.boundaries:main"       # Pipeline 2 辅助：渲染拆分边界页供判读 fresh/shared
toc-onenote-sections  = "tocgen.cli.onenote_sections:main" # Pipeline 2.5 建分区组+空分区（支持 --local-path 本地笔记本）
toc-onenote-clear     = "tocgen.cli.onenote_clear:main"    # Pipeline 3 前：清空分区所有页（重打印前用，进回收站可恢复）
toc-onenote-import    = "tocgen.cli.onenote_import:main"   # Pipeline 3 打印 PDF 进分区（需 SumatraPDF）
toc-onenote-fix       = "tocgen.cli.onenote_fix:main"      # 修复 OneNote「正在清理…」卡死（杀进程+重启，不删数据）
toc-onenote-titles    = "tocgen.cli.onenote_titles:main"  # Pipeline 4 核对标题/删占位/去重
toc-onenote-strip     = "tocgen.cli.onenote_strip:main"   # Pipeline 4 删误插入附件
toc-onenote-copy-online = "tocgen.cli.onenote_copy_online:main" # Pipeline 5 OneNote 原生整页复制到 OneDrive
toc-onenote-batch       = "tocgen.cli.onenote_batch:main"       # Pipeline 5 无人值守批处理/断点续跑/状态日志

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tocgen"]
